; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
platform_packages = 
	platformio/framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.5
	platformio/framework-arduinoespressif32-libs @ https://github.com/espressif/esp32-arduino-libs.git#idf-release/v5.1
upload_protocol = esptool
board_upload.flash_size = 32MB
board_build.partitions = large_fat_32MB.csv
build_flags = 
	-DCONFIG_ESP_CONSOLE_USB_CDC=1
	-DCONFIG_ESP_WIFI_ENABLED=0
	-DCONFIG_BT_ENABLED=0
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = dio
board_build.flash_freq = 80MHz
upload_speed = 115200
monitor_speed = 115200
lib_deps = 
	sensorium/Mozzi@^2.0.2
	madhephaestus/ESP32Encoder@^0.11.8
	sstaub/Ticker@^4.4.0
